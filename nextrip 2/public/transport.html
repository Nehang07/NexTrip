<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buses &amp; Trains — NexTrip</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
<style>
.search-card { background: var(--white); border-radius: 16px; border: 1px solid var(--sand2); padding: 1.75rem; margin: -3rem 5vw 2rem; position: relative; z-index: 5; box-shadow: 0 20px 48px rgba(0,0,0,0.08); }
.search-grid { display: grid; grid-template-columns: 1fr 1fr auto 1fr auto; gap: 1rem; align-items: end; }
.swap-btn { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--sand2); background: var(--white); cursor: pointer; font-size: 1rem; transition: all 0.2s ease; align-self: center; margin-bottom: 4px; }
.swap-btn:hover { border-color: var(--teal); color: var(--teal); transform: rotate(180deg); }
@media (max-width: 950px) { .search-grid { grid-template-columns: 1fr 1fr; } .swap-btn { display: none; } }

.results-wrap { max-width: 1000px; margin: 0 auto; padding: 0 5vw 4rem; }
.results-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
.results-title { font-family: 'Fraunces', serif; font-size: 1.3rem; font-weight: 700; }
.results-sub { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }

.bus-card {
  background: var(--white); border: 1px solid var(--sand2); border-radius: 14px; padding: 1.4rem 1.5rem;
  display: grid; grid-template-columns: 1.4fr 1fr auto; gap: 1.25rem; align-items: center; margin-bottom: 1rem;
  transition: transform 0.25s cubic-bezier(.2,.7,.2,1), box-shadow 0.25s ease;
  opacity: 0; transform: translateY(14px); animation: fade-in-up 0.5s ease forwards;
}
.bus-card:hover { transform: translateY(-4px); box-shadow: 0 16px 36px rgba(0,0,0,0.08); }
.bus-operator { font-weight: 700; font-size: 0.95rem; margin-bottom: 3px; }
.bus-type { font-size: 0.78rem; color: var(--muted); }
.bus-times { display: flex; align-items: center; gap: 10px; }
.bus-time-block { text-align: center; }
.bus-time { font-family: 'Fraunces', serif; font-size: 1.15rem; font-weight: 700; }
.bus-city { font-size: 0.72rem; color: var(--muted); }
.bus-duration { font-size: 0.72rem; color: var(--muted); text-align: center; min-width: 60px; }
.bus-price-block { text-align: right; }
.bus-price { font-family: 'Fraunces', serif; font-size: 1.25rem; font-weight: 800; color: var(--teal-dk); }
.bus-seats { font-size: 0.72rem; color: var(--accent); margin: 4px 0 10px; }
@media (max-width: 700px) { .bus-card { grid-template-columns: 1fr; } .bus-price-block { text-align: left; } }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo"><svg width="28" height="28" viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;"><defs><linearGradient id="ntGrad" x1="0" y1="0" x2="30" y2="30" gradientUnits="userSpaceOnUse"><stop stop-color="#14b892"/><stop offset="1" stop-color="#075a45"/></linearGradient></defs><rect width="30" height="30" rx="9" fill="url(#ntGrad)"/><path d="M8 15.5L21.5 6.5L16 22L13 16.5L8 15.5Z" fill="#fff"/></svg><span class="logo-word">Nex<span class="logo-accent">Trip</span></span></a>
  <ul class="nav-links">
    <li><a href="flights.html">Flights</a></li>
    <li><a href="hotels.html">Hotels</a></li>
    <li><a href="transport.html" class="active">Buses &amp; Trains</a></li>
    <li><a href="explorer.html">Explore</a></li>
    <li><a href="planner.html">AI Planner</a></li>
    <li><a href="reviews.html">Reviews</a></li>
    <li id="nav-auth-slot"></li>
  </ul>
</nav>

<div class="page-banner">
  <h1>Buses &amp; Trains</h1>
  <p>Domestic India routes — book a seat on the country's highways in a few clicks.</p>
</div>

<div class="search-card reveal">
  <form id="bus-search-form" onsubmit="return searchBuses(event)">
    <div class="search-grid">
      <div class="field">
        <label>From</label>
        <select id="origin-select" required></select>
      </div>
      <div class="field">
        <label>To</label>
        <select id="destination-select" required></select>
      </div>
      <button type="button" class="swap-btn" onclick="swapCities()" title="Swap">⇄</button>
      <div class="field">
        <label>Travel date</label>
        <input type="date" id="travel-date" required>
      </div>
      <button class="btn-primary" type="submit" style="height:44px;">Search</button>
    </div>
  </form>
</div>

<div class="results-wrap">
  <div class="results-head">
    <div>
      <div class="results-title" id="results-title">Popular routes</div>
      <div class="results-sub" id="results-sub">Loading…</div>
    </div>
    <select class="sort-select" id="sort-select" onchange="renderResults()">
      <option value="price">Sort: Price (low to high)</option>
      <option value="duration">Sort: Shortest duration</option>
      <option value="departure">Sort: Earliest departure</option>
    </select>
  </div>
  <div id="bus-results">
    <div class="loading-state"><div class="spinner"></div>Loading…</div>
  </div>
</div>

<footer>
  Built by Team NexTrip &nbsp;·&nbsp; <a href="about.html" style="color:rgba(255,255,255,0.45);">About Us</a> &nbsp;·&nbsp; <span>Flask + SQLite</span>
</footer>

<script src="/static/js/nav.js"></script>
<script>
const INDIA_CITIES = ["Delhi","Mumbai","Bangalore","Chennai","Kolkata","Goa","Jaipur","Agra","Pune","Chandigarh"];
let currentResults = [];

function loadCities() {
  const opts = INDIA_CITIES.map(c => `<option value="${c}">${c}</option>`).join('');
  document.getElementById('origin-select').innerHTML = opts;
  document.getElementById('destination-select').innerHTML = opts;
  document.getElementById('origin-select').value = 'Delhi';
  document.getElementById('destination-select').value = 'Jaipur';

  const params = new URLSearchParams(location.search);
  if (params.get('origin')) document.getElementById('origin-select').value = params.get('origin');
  if (params.get('destination')) document.getElementById('destination-select').value = params.get('destination');

  const dateInput = document.getElementById('travel-date');
  const tomorrow = new Date(Date.now() + 86400000);
  dateInput.value = tomorrow.toISOString().slice(0, 10);
  dateInput.min = new Date().toISOString().slice(0, 10);

  searchBuses(null);
}

function swapCities() {
  const o = document.getElementById('origin-select');
  const d = document.getElementById('destination-select');
  [o.value, d.value] = [d.value, o.value];
}

async function searchBuses(e) {
  if (e) e.preventDefault();
  const origin = document.getElementById('origin-select').value;
  const destination = document.getElementById('destination-select').value;

  document.getElementById('bus-results').innerHTML = '<div class="loading-state"><div class="spinner"></div>Searching…</div>';

  const res = await fetch(`/api/buses?origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(destination)}`);
  const data = await res.json();
  currentResults = data.results;

  document.getElementById('results-title').textContent = `${origin} → ${destination}`;
  document.getElementById('results-sub').textContent = `${data.count} option${data.count === 1 ? '' : 's'} found`;
  renderResults();
  return false;
}

function renderResults() {
  const sort = document.getElementById('sort-select').value;
  let results = [...currentResults];
  if (sort === 'duration') results.sort((a, b) => a.duration_mins - b.duration_mins);
  else if (sort === 'departure') results.sort((a, b) => a.depart_time.localeCompare(b.depart_time));
  else results.sort((a, b) => a.price - b.price);

  const el = document.getElementById('bus-results');
  if (results.length === 0) {
    el.innerHTML = '<div class="empty-state">No services found for this route. Try a different city pair — buses/trains currently cover major India routes.</div>';
    return;
  }

  el.innerHTML = results.map((b, idx) => `
    <div class="bus-card" style="animation-delay:${idx * 0.06}s;">
      <div>
        <div class="bus-operator">${b.operator}</div>
        <div class="bus-type">${b.bus_type}</div>
      </div>
      <div class="bus-times">
        <div class="bus-time-block"><div class="bus-time">${b.depart_time}</div><div class="bus-city">${b.origin}</div></div>
        <div class="bus-duration">${Math.floor(b.duration_mins/60)}h ${b.duration_mins%60}m →</div>
        <div class="bus-time-block"><div class="bus-time">${b.arrive_time}</div><div class="bus-city">${b.destination}</div></div>
      </div>
      <div class="bus-price-block">
        <div class="bus-price">₹${b.price.toLocaleString()}</div>
        <div class="bus-seats">${b.seats_available} seats left</div>
        <button class="btn-primary" onclick="bookBus(${b.id})">Book Now</button>
      </div>
    </div>
  `).join('');
}

function bookBus(busId) {
  if (!CURRENT_USER) { showToast('Sign in to book'); openAuthModal('login'); return; }
  const bus = currentResults.find(b => b.id === busId);
  const date = document.getElementById('travel-date').value;
  sessionStorage.setItem('nextrip_checkout', JSON.stringify({
    booking_type: 'bus', item: bus, amount: bus.price,
    details: { date, passenger_name: CURRENT_USER.name },
  }));
  location.href = 'checkout.html';
}

function onAuthChanged() { /* nothing extra needed */ }
loadCities();
</script>
</body>
</html>
